<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Normal Calculator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="calculator-page">

    <div class="calculator-container">

        <h1 class="calculator-title">
            🧮 Normal Calculator
        </h1>

        <input
            type="text"
            id="display"
            class="display"
            readonly
        >

        <div class="buttons">

            <button class="calc-btn clear"
                    onclick="clearDisplay()">
                C
            </button>

            <button class="calc-btn"
                    onclick="backspace()">
                ⌫
            </button>

            <button class="calc-btn operator"
                    onclick="add('%')">
                %
            </button>

            <button class="calc-btn operator"
                    onclick="add('/')">
                ÷
            </button>


            <button class="calc-btn"
                    onclick="add('7')">
                7
            </button>

            <button class="calc-btn"
                    onclick="add('8')">
                8
            </button>

            <button class="calc-btn"
                    onclick="add('9')">
                9
            </button>

            <button class="calc-btn operator"
                    onclick="add('*')">
                ×
            </button>


            <button class="calc-btn"
                    onclick="add('4')">
                4
            </button>

            <button class="calc-btn"
                    onclick="add('5')">
                5
            </button>

            <button class="calc-btn"
                    onclick="add('6')">
                6
            </button>

            <button class="calc-btn operator"
                    onclick="add('-')">
                −
            </button>


            <button class="calc-btn"
                    onclick="add('1')">
                1
            </button>

            <button class="calc-btn"
                    onclick="add('2')">
                2
            </button>

            <button class="calc-btn"
                    onclick="add('3')">
                3
            </button>

            <button class="calc-btn operator"
                    onclick="add('+')">
                +
            </button>


            <button class="calc-btn"
                    onclick="add('0')">
                0
            </button>

            <button class="calc-btn"
                    onclick="add('.')">
                .
            </button>

            <button class="calc-btn equal"
                    style="grid-column: span 2;"
                    onclick="calculate()">
                =
            </button>

        </div>


        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>


<script src="{{ url_for('static', filename='js/normal.js') }}"></script>

</body>

</html>
